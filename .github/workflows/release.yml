name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Newer ubuntu-24.04 images sometimes leave git without a CA bundle (CAfile: none).
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ASSET="janitor-${VERSION}.tar.gz"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        id: archive
        run: |
          git archive \
            --format=tar.gz \
            --prefix="janitor-${{ steps.meta.outputs.version }}/" \
            -o "${{ steps.meta.outputs.asset }}" \
            "${{ steps.meta.outputs.tag }}"
          sha256sum "${{ steps.meta.outputs.asset }}" | tee sha256.txt
          echo "sha256=$(cut -d' ' -f1 sha256.txt)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.asset }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set" >&2
            exit 1
          fi

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/b4moss/homebrew-tap.git" \
            homebrew-tap

          # Generate formula without relying on shell heredoc indentation.
          python3 - "$URL" "$SHA256" "${GITHUB_REPOSITORY}" <<'PY'
          import pathlib
          import sys

          url, sha256, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          pathlib.Path("homebrew-tap/janitor.rb").write_text(
              "\n".join(
                  [
                      "# typed: false",
                      "# frozen_string_literal: true",
                      "",
                      "class Janitor < Formula",
                      '  desc "Clean up package directories as oneshot"',
                      f'  homepage "https://github.com/{repo}"',
                      f'  url "{url}"',
                      f'  sha256 "{sha256}"',
                      '  license "MIT"',
                      "",
                      "  def install",
                      '    bin.install "src/janitor.sh" => "janitor"',
                      "  end",
                      "",
                      "  test do",
                      '    assert_match "No target directories", shell_output("#{bin}/janitor --dry-run")',
                      "  end",
                      "end",
                      "",
                  ]
              )
          )
          PY

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add janitor.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "Update janitor to ${TAG}"
          git push origin HEAD:main
