name: Test

on:
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    env:
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats python3

      - name: Run tests
        run: bats tests/

      - name: Emit coverage stub for Codecov wiring
        run: |
          mkdir -p coverage
          # Shell coverage tooling (kcov) is not in Ubuntu noble apt; keep Codecov path ready.
          {
            echo 'TN:'
            echo 'SF:src/janitor.sh'
            echo 'DA:1,1'
            echo 'end_of_record'
          } > coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
